# ── Saturday re-deal workflow ─────────────────────────────────────────────────
# The automation token used for agent PRs lacks the `workflow` OAuth scope, so
# this ships as a template. To activate: move this file (minus this comment
# block) to .github/workflows/saturday_redeal.yml.
#
# Runs Saturdays at 8 AM Pacific (15:00 UTC): re-runs every flagged bet at the
# current line and auto-drops anything outside the unified gate (src/gates.py).
# Never touches tracked_bets.json — drops are recommendations in the re-deal
# file; bet history stays intact.

name: Saturday Re-deal

on:
  schedule:
    - cron: '0 15 * * 6'   # 8 AM Pacific, Saturdays
  workflow_dispatch:

permissions:
  contents: write

jobs:
  redeal:
    name: Re-deal flagged bets at current lines
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Re-deal at current lines
        env:
          CFB_API_KEY:  ${{ secrets.CFB_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python scripts/saturday_redeal.py
      - name: Commit re-deal verdicts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add outputs/picks
          if git diff --staged --quiet; then
            echo "No re-deal changes"
          else
            git commit -m "Saturday re-deal $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
