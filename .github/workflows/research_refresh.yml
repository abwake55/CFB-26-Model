name: Decision quality research refresh
on:
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * 3'
permissions:
  contents: write
concurrency:
  group: decision-quality-research
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Collect historical and current possessions
        env:
          CFB_API_KEY: ${{ secrets.CFB_API_KEY }}
        run: python scripts/refresh_drives.py
      - name: Evaluate frozen challenger methods
        run: python scripts/evaluate_challengers.py
      - name: Archive current forecasts
        run: python scripts/collect_context.py --weather
      - name: Record current model decisions
        env:
          CFB_API_KEY: ${{ secrets.CFB_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python scripts/record_decisions.py
      - run: python scripts/decision_report.py
      - name: Save research results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/raw/drives data/context data/lines_snapshots outputs/predictions
          if ! git diff --staged --quiet; then
            git commit -m "Archive decision quality research results"
            git pull --rebase origin main
            git push
          fi
