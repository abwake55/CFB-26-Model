name: Decision quality research refresh
on:
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * 3'
permissions:
  contents: write
  issues: write
concurrency:
  group: ${{ github.workflow }}   # never overlap with itself; pushes rebase+retry
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Collect historical and current possessions
        env:
          CFB_API_KEY: ${{ secrets.CFB_API_KEY }}
        run: python scripts/refresh_drives.py
      - name: Evaluate frozen challenger methods
        run: python scripts/evaluate_challengers.py
      - name: Archive current forecasts
        run: python scripts/collect_context.py --weather
      - name: Record current model decisions
        env:
          CFB_API_KEY: ${{ secrets.CFB_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python scripts/record_decisions.py
      - run: python scripts/audit_markets.py
      - run: python scripts/grade_market_edges.py
      - run: python scripts/decision_report.py
      - name: Save research results
        run: >-
          bash .github/scripts/commit_and_push.sh
          "Archive decision quality research results"
          data/raw/drives data/context data/lines_snapshots outputs/predictions

      - name: Report failure
        if: failure() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/report_failure.sh
