name: Saturday Re-deal

on:
  schedule:
    - cron: '0 15 * * 6'   # 8 AM Pacific, Saturdays
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: ${{ github.workflow }}   # never overlap with itself; pushes rebase+retry
  cancel-in-progress: false

jobs:
  redeal:
    name: Re-deal flagged bets at current lines
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Re-deal at current lines
        env:
          CFB_API_KEY:  ${{ secrets.CFB_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python scripts/saturday_redeal.py
      - name: Commit re-deal verdicts
        run: >-
          bash .github/scripts/commit_and_push.sh
          "Saturday re-deal $(date -u +'%Y-%m-%d %H:%M UTC')"
          outputs/picks

      - name: Report failure
        if: failure() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/report_failure.sh
