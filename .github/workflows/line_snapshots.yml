name: Line Snapshots (daily)

# ── Why ───────────────────────────────────────────────────────────────────────
# Totals move all week. The app flags picks against the line it first saw; this
# workflow snapshots consensus lines once a day so the app can warn when the
# market has bet a flagged edge away ("UNDER 59 on Tue, now 56 — edge gone").
# The snapshot script no-ops in the offseason or before books post lines, so
# the daily cron can stay on year-round.

on:
  push:
    branches: [main]
    paths: ['.github/workflows/line_snapshots.yml']
  schedule:
    - cron: '0 14 * * *'   # 6 AM Pacific, daily
    # Opener capture: CFB openers post Sunday afternoon/evening Pacific.
    # Two extra Sunday runs record `first` (the opener) and the ledger's
    # opener-time flags/bet lines before Monday's market moves.
    - cron: '0 21 * * 0'   # Sun 1 PM Pacific
    - cron: '0 1 * * 1'    # Sun 5 PM Pacific
  workflow_dispatch:

permissions:
  contents: write   # push updated snapshots back to the repo
  issues: write     # open an issue when the job fails

concurrency:
  group: ${{ github.workflow }}   # never overlap with itself; pushes rebase+retry
  cancel-in-progress: false

jobs:
  snapshot:
    name: Snapshot current-week lines
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # one 3-credit Odds API call per run, shared by every step below
      ODDS_API_CACHE: /tmp/odds_cache.json
      ODDS_API_CACHE_MAX_AGE: '1800'
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Snapshot lines
        env:
          CFB_API_KEY:  ${{ secrets.CFB_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python scripts/snapshot_lines.py

      # PT posts the week's system lines early in the week (Tue); pick them
      # up daily so the ledger's PT flag appears as soon as they exist.
      - name: Fetch Prediction Tracker live week
        run: python scripts/fetch_prediction_tracker.py --live

      - name: Archive pregame weather forecasts
        run: python scripts/collect_context.py --weather

      # Re-record the 2026 ledger's current-week snapshot at the latest lines.
      # prediction_ledger.record replaces only ungraded rows for the week and
      # skips entirely once the slate has kicked off, so this just keeps the
      # dealt-lines snapshot fresh as books post through the week.
      - name: Re-record ledger snapshot at current lines
        env:
          CFB_API_KEY:  ${{ secrets.CFB_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          python scripts/prediction_ledger.py record
          python scripts/record_decisions.py

      - name: Log Odds API quota (free endpoint)
        if: always()
        continue-on-error: true
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python scripts/odds_usage.py

      - name: Commit and push snapshots
        run: >-
          bash .github/scripts/commit_and_push.sh
          "Line snapshot $(date -u +'%Y-%m-%d %H:%M UTC')"
          data/lines_snapshots data/context outputs/predictions data/external/prediction_tracker data/odds_api_usage

      - name: Report failure
        if: failure() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/report_failure.sh
